<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<title>$title</title>
$styles
</head>
<body class="board-page">
<div id="stage"><div id="world"></div></div>
<p id="empty" class="empty" hidden>This board is empty.</p>
<p id="loading" class="empty">Loading&hellip;</p>

<header id="topbar" class="bar topbar">
	<a id="back" class="icon-btn" href="index.html" aria-label="All boards">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
	</a>
	<div class="titles">
		<h1 id="title">$title</h1>
		<p id="subtitle"></p>
	</div>
	<button id="searchBtn" class="icon-btn" type="button" aria-label="Search" title="Search (/)">
		<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
	</button>
</header>

<nav id="dock" class="bar dock" aria-label="Board navigation">
	<button id="framesBtn" class="icon-btn" type="button" aria-label="Frames" title="Frames">
		<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9h17M9 9v10.5"/></svg>
	</button>
	<div class="pager">
		<button id="prevFrame" class="icon-btn" type="button" aria-label="Previous frame" title="Previous frame (&larr;)">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
		</button>
		<button id="frameLabel" class="pager-label" type="button" aria-label="Frames">&ndash;</button>
		<button id="nextFrame" class="icon-btn" type="button" aria-label="Next frame" title="Next frame (&rarr;)">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
		</button>
	</div>
	<button id="zoomOut" class="icon-btn desktop-only" type="button" aria-label="Zoom out" title="Zoom out (&minus;)">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
	</button>
	<button id="zoomLabel" class="zoom-label" type="button" aria-label="Fit the board" title="Fit the board (0)">100%</button>
	<button id="zoomIn" class="icon-btn desktop-only" type="button" aria-label="Zoom in" title="Zoom in (+)">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
	</button>
</nav>

<section id="framesPanel" class="panel side" hidden aria-label="Frames">
	<div class="panel-head">
		<h2>Frames</h2>
		<button class="icon-btn" type="button" data-close aria-label="Close">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
		</button>
	</div>
	<div class="panel-body">
		<ol id="frameList" class="list"></ol>
		<div id="unplacedSection" hidden>
			<h3>Not on the canvas</h3>
			<p class="note">Kanban cards and table cells come from Miro's API without a position.</p>
			<ul id="unplacedList" class="list"></ul>
		</div>
		<p id="skippedNote" class="note" hidden></p>
	</div>
</section>

<section id="searchPanel" class="panel side" hidden aria-label="Search">
	<div class="panel-head">
		<input id="searchInput" type="search" placeholder="Search this board" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search this board">
		<button class="icon-btn" type="button" data-close aria-label="Close">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
		</button>
	</div>
	<div class="panel-body">
		<p id="searchCount" class="note"></p>
		<ol id="searchResults" class="list"></ol>
	</div>
</section>

<section id="sheet" class="panel sheet" hidden aria-label="Item details">
	<div class="panel-head">
		<div class="sheet-heading">
			<p id="sheetType" class="eyebrow"></p>
			<h2 id="sheetTitle"></h2>
		</div>
		<button class="icon-btn" type="button" data-close aria-label="Close">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
		</button>
	</div>
	<div class="panel-body">
		<div id="sheetText" class="sheet-text"></div>
		<p id="sheetMeta" class="note"></p>
		<div id="sheetActions" class="actions"></div>
	</div>
</section>

<div id="lightbox" class="lightbox" hidden>
	<img id="lightboxImg" alt="">
	<div class="lightbox-bar">
		<a id="lightboxOrig" class="pill" target="_blank" rel="noopener">Original file</a>
		<button id="lightboxClose" class="icon-btn" type="button" aria-label="Close">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
		</button>
	</div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p class="empty">This board needs JavaScript.</p></noscript>

$scripts
<script src="$data"></script>
</body>
</html>
