[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miro-exporter"
version = "0.1.0"
description = "Back up Miro boards (every item, connector, tag, group, member and file) into organized snapshot folders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"requests>=2.31",
	"tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The board viewer (`miro-view`): image previews and PDF page renders.
viewer = [
	"Pillow>=10",
	"pymupdf>=1.24",
]

[project.scripts]
miro-export = "miro_exporter.cli:main"
miro-view = "miro_viewer.cli:main"

[tool.setuptools]
packages = ["miro_exporter", "miro_viewer"]

[tool.setuptools.package-data]
miro_viewer = ["static/**/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
	# PyMuPDF's SWIG bindings, on newer Pythons
	"ignore:builtin type [Ss]wig:DeprecationWarning",
]
